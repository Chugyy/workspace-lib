[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-card"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
interactive-card = "interactive_card.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
