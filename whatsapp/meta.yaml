id: whatsapp
type: tool
description: >
  Envoyer et recevoir des messages WhatsApp via WAHA (self-hosted).
requires:
  env:
    - WAHA_BASE_URL: "URL du serveur WAHA (ex: http://localhost:3000)"
    - WAHA_API_KEY: "Cle API WAHA (WHATSAPP_API_KEY dans le container Docker)"
    - WAHA_SESSION: "Nom de la session WAHA (default: default)"
  system:
    - python3
    - docker
  setup: "./setup.sh"
