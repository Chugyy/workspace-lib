[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-manager"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.24.0",
]

[project.scripts]
whatsapp = "whatsapp_manager.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
