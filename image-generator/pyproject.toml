[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "image-generator"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "openai>=1.30.0",
]

[project.scripts]
image-gen = "image_generator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
