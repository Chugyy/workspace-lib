[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-cli"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "anthropic>=0.40.0",
]

[project.scripts]
claude-cli = "claude_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
