[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-engine"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "mlx-audio",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "misaki",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    "spacy",
]

[project.scripts]
tts = "tts_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["assets/voices/*"]
